[evidence]
source = "[TUBS deposit](https://doi.org/10.24355/dbbs.084-202605201212-0), including its experimental README."
metadata = { status = "met", note = "The source README reports instrument, geometry, mass, purge gas, crucible and thermal programs." }
calibration = { status = "partial", note = "The README documents baseline correction and temperature and heat-flow calibration. Blank traces and independent thermal-lag measurements are unavailable." }
repeatability = { status = "partial", note = "The controlled mass series covers 50 K/min. Mass independence across the full rate range remains unestablished." }
components = { status = "missing", note = "Component assignments require separate evidence." }

[prediction]
