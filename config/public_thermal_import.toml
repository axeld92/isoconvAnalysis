# Raw hashes and byte counts are from the pinned acquisition manifests under data/external.
# Reference counts, ranges and slopes are from the independent CSV inventories generated
# by scripts/fetch_public_benchmarks.py. All ranges retain the reported source units.
# Numeric digests use Python csv and float parsing and SHA-256 of struct.pack("<d", value)
# for each value in acquisition order, with no header, delimiter or unit conversion.
schema_version = 1
temperature_unit = "C"
time_unit = "min"

[profiles.picnik_synthetic]
delimiter = ","
encoding = "utf8"
temperature_column = "T (C)"
time_column = "t (min)"
signals = [
    { id = "mass", column = "m (mg)", unit = "mg", quantity = "mass" },
]

[profiles.picnik_pp]
delimiter = "\t"
encoding = "utf8"
temperature_column = "Temperature (C)"
time_column = "Time (min)"
signals = [
    { id = "mass", column = "Weight (mg)", unit = "mg", quantity = "mass" },
]

[profiles.netzsch_dsc]
delimiter = ";"
encoding = "cp1252"
header_prefix = "##"
temperature_column = "Temp./›C"
time_column = "Time/min"
segment_column = "Segment"
signals = [
    { id = "heat_flow", column = "DSC/(mW/mg)", unit = "mW_per_mg", quantity = "specific_heat_flow" },
    { id = "sensitivity", column = "Sensit./(uV/mW)", unit = "uV_per_mW", quantity = "auxiliary" },
]

[profiles.netzsch_dsc_with_gas_flow]
delimiter = ";"
encoding = "cp1252"
header_prefix = "##"
temperature_column = "Temp./›C"
time_column = "Time/min"
segment_column = "Segment"
signals = [
    { id = "heat_flow", column = "DSC/(mW/mg)", unit = "mW_per_mg", quantity = "specific_heat_flow" },
    { id = "purge_flow", column = "Gas Flow(purge1)/(ml/min)", unit = "mL_per_min", quantity = "auxiliary" },
    { id = "protective_flow", column = "Gas Flow(protective)/(ml/min)", unit = "mL_per_min", quantity = "auxiliary" },
    { id = "sensitivity", column = "Sensit./(uV/mW)", unit = "uV_per_mW", quantity = "auxiliary" },
]

[profiles.netzsch_dsc_modulated]
delimiter = ";"
encoding = "cp1252"
header_prefix = "##"
temperature_column = "Temp./›C"
time_column = "Time/min"
segment_column = "Segment"
signals = [
    { id = "heat_flow_raw", column = "DSC(raw)/(mW/mg)", unit = "mW_per_mg", quantity = "specific_heat_flow" },
    { id = "heat_flow_average", column = "DSC(avg)/(mW/mg)", unit = "mW_per_mg", quantity = "specific_heat_flow" },
    { id = "purge_flow", column = "Gas Flow(purge1)/(ml/min)", unit = "mL_per_min", quantity = "auxiliary" },
    { id = "protective_flow", column = "Gas Flow(protective)/(ml/min)", unit = "mL_per_min", quantity = "auxiliary" },
    { id = "sensitivity", column = "Sensit./(uV/mW)", unit = "uV_per_mW", quantity = "auxiliary" },
]

