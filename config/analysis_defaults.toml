[project]
# Relative paths are resolved from this file, not from the current working directory.
output_directory = "../results"
log_level = "info"

[units]
# Boundary units used in legacy NETZSCH exports and human-readable reports.
measured_temperature = "°C"
thermodynamic_temperature = "K"
time = "min"
mass = "mg"
heating_rate = "K/min"
activation_energy = "kJ/mol"
conversion = "1"
conversion_rate = "min^-1"

[conversion]
# The primary convention decided in M0. Alternative endpoints are sensitivity analyses.
initial_temperature_celsius = 150.0
final_temperature_celsius = 700.0
initial_sensitivity_celsius = [120.0]
final_sensitivity_celsius = [650.0, 750.0]
include_highest_common_temperature = true

[preprocessing]
# Accepted after the M3 synthetic and real-data sensitivity audit.
profile = "m3_default_v1"
invalid_row_policy = "drop_nonfinite"
segment_policy = "recorded_ramp"
rebase_time = true
reference_mass_method = "local_robust_linear"
reference_half_window_kelvin = 2.0
smoothing_method = "local_polynomial"
smoothing_half_window_kelvin = 5.0
local_polynomial_degree = 3
derivative_method = "local_polynomial"
heating_rate_method = "local_polynomial"
monotonic_conversion_policy = "diagnose"
analysis_conversion_range = [0.05, 0.95]
reconstruction_rmse_tolerance = 0.01

[isoconversional]
alpha_grid = [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
interpolation_policy = "first_upward_crossing"
confidence_level = 0.95
minimum_experiments = 3
friedman_minimum_rate_per_minute = 1.0e-10
minimum_r_squared_warning = 0.90

[isoconversional.advanced_vyazovkin]
delta_alpha = 0.02
integration_points = 41
energy_bounds_kilojoule_per_mole = [20.0, 500.0]
optimizer_grid_points = 241
optimizer_tolerance_kilojoule_per_mole = 1.0e-6
optimizer_max_iterations = 250
boundary_tolerance_kilojoule_per_mole = 0.5
flat_relative_tolerance = 1.0e-6

[deconvolution]
peak_counts = [2, 3, 4]
selection_criterion = "bic"
fit_conversion_range = [0.05, 0.95]
maximum_fit_points = 600
minimum_center_separation_kelvin = 8.0
skew_bounds = [-1.5, 1.5]
width_bounds_kelvin = [5.0, 250.0]
maximum_height_factor = 3.0
minimum_component_area_fraction = 0.02
multistart_count = 5
joint_multistart_count = 2
optimizer_max_iterations = 600
optimizer_gradient_tolerance = 1.0e-7
optimizer_function_tolerance = 1.0e-12
identifiability_condition_warning = 1.0e10
boundary_fraction_tolerance = 0.01
confidence_level = 0.95

[reaction_models]
# M6 fits one overall-conversion kinetic triplet jointly across heating rates. Ordered M5
# peaks are not assigned common identities or propagated into this fit.
models = ["f1", "f2", "f3", "f4", "a2", "a3", "a4", "r2", "r3", "d1", "d2", "d3", "d4", "p2", "p3", "p4", "random_scission", "sestak_berggren_2", "sestak_berggren_3"]
compensation_models = ["f1", "f2", "f3", "f4", "a2", "a3", "a4", "r2", "r3", "d1", "d2", "d3", "d4", "p2", "p3", "p4", "random_scission"]
fit_conversion_range = [0.10, 0.90]
maximum_points_per_experiment = 250
minimum_rate_per_minute = 1.0e-10
selection_criterion = "bic"
energy_bounds_kilojoule_per_mole = [20.0, 500.0]
sestak_berggren_exponent_bounds = [-5.0, 5.0]
minimum_experiments = 3
confidence_level = 0.95
identifiability_condition_warning = 1.0e8
parameter_correlation_warning = 0.995
ambiguity_criterion_delta = 2.0
maximum_cross_validation_log_rmse = 0.25
