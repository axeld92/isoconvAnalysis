schema_version = 1

# ICTAC 2011 §3 reporting grid. Unsupported points remain visible.
alpha_grid = [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
central_alpha = [0.10, 0.90]

# Numerical settings for this report, rather than ICTAC acceptance limits.
ramp_probe_alpha = 0.50
ramp_probe_energy_kJ_per_mol = 120.0
derivative_sensitivity = ["narrow_quadratic", "wide_quadratic"]
pp_reference_sensitivity = ["earlier_terminal", "later_initial", "reaction_window"]

[tire]
reaction_C = [140.0, 760.0]
initial_C = [148.0, 152.0]
terminal_C = [698.0, 702.0]
alternative_initial_C = [118.0, 122.0]
alternative_terminal_C = [648.0, 652.0]
omitted_run = "dynamic_wt100_rate20"

[references]
computation = "https://doi.org/10.1016/j.tca.2011.03.034"
data_collection = "https://doi.org/10.1016/j.tca.2014.05.036"
multistep = "https://doi.org/10.1016/j.tca.2020.178597"
decomposition = "https://doi.org/10.1016/j.tca.2022.179384"

# Study-specific evidence statements. These apply to the identified data sources only.
[evidence.polypropylene]
metadata = "Pinned files provide time, temperature, and mass. The symposium description gives instrument and purge information for four rates. Its file-level linkage and the 10 K/min acquisition remain unresolved."
calibration = "Calibration records and blank correction are unavailable. The 10 K/min file has a negative apparent terminal mass."
repeatability = "One retained file per program. No repeatability or controlled sample-mass study accompanies these files."
prediction = "The separate measured-mass benchmark omitted one ramp per fold. An independent isothermal or other-program validation is unavailable for this cohort."
source = "[PP conversion audit](public_tg_conversion.md) and [PP prediction script](../scripts/audit_public_pp_prediction.jl)."

[evidence.tires]
metadata = "NETZSCH exports record sample mass, instrument, crucible, purge flows, temperature calibration and correction filenames. The data dictionary records nitrogen. Gas grade is unresolved."
calibration = "Calibration and correction filenames are recorded per rate. Calibration performance and an independently assessed blank or thermal-lag check are unavailable."
repeatability = "One retained ramp per rate. Similar sample masses do not constitute a controlled mass-sensitivity experiment. No matched repeats are available."
prediction = "The current component study did not predict the reserved tire holds. The older tire-paper source is outside this assessment."
source = "[Data dictionary](data_dictionary.md)."
